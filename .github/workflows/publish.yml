name: Publish

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - '*v*'

jobs:
  npm-publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: '.nvmrc'
      - name: Authenticate to Google Cloud for OSS Exit Gate
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Stage to Artifact Registry and trigger OSS Exit Gate
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cat << 'NPMRC' > "$HOME/.npmrc"
          registry=https://us-npm.pkg.dev/oss-exit-gate-prod/webdriver-bidi-protocol--npm/
          //us-npm.pkg.dev/oss-exit-gate-prod/webdriver-bidi-protocol--npm/:always-auth=true
          //us-npm.pkg.dev/oss-exit-gate-prod/webdriver-bidi-protocol--npm/:_authToken=${ACCESS_TOKEN}
          NPMRC
          trap 'rm -f "$HOME/.npmrc"' EXIT
          npm publish --access public --registry="https://us-npm.pkg.dev/oss-exit-gate-prod/webdriver-bidi-protocol--npm/"
          cat << 'MANIFEST' > manifest.json
          {
            "publish_all": true
          }
          MANIFEST
          gcloud storage cp manifest.json "gs://oss-exit-gate-prod-projects-bucket/webdriver-bidi-protocol/npm/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
